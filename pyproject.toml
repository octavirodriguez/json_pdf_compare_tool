[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-pdf-compare-tool"
version = "1.2.0"
description = "Compare structured JSON data with PDF documents."
requires-python = ">=3.9"
dependencies = [
    "customtkinter",
    "pypdf",
    "tkinterdnd2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
build = [
    "py2app",
]